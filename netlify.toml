# Netlify config for ARB.
#
# Nothing is built: the app is plain ES modules plus vendored three.js and
# MediaPipe, so the repo root is published as-is.

[build]
  publish = "."
  command = ""

# MediaPipe's threaded wasm needs cross-origin isolation, the same reason
# serve.py sends these. Everything the page loads is same-origin, so
# require-corp costs nothing here.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

# A wrong Content-Type makes the browser refuse the wasm outright.
[[headers]]
  for = "/vendor/tasks-vision/wasm/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/models/*.task"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
